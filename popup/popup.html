<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prospecta</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="../icons/icon32.png" alt="" width="24" height="24" />
      <span>Prospecta</span>
      <em id="version"></em>
    </div>
    <button id="toggle" class="status" type="button">
      <i class="dot"></i><span id="toggle-label"></span>
    </button>
  </header>

  <section class="summary">
    <div class="total">
      <b id="s-total">0</b>
      <span data-i18n="leadsCaptured"></span>
    </div>
    <div class="bar" id="bar" aria-hidden="true">
      <i class="seg seg--none"></i><i class="seg seg--social"></i><i class="seg seg--unknown"></i><i class="seg seg--site"></i>
    </div>
    <ul class="legend">
      <li><i class="sw sw--none"></i><span data-i18n="typeNone"></span> <b id="s-none">0</b></li>
      <li><i class="sw sw--social"></i><span data-i18n="legendSocial"></span> <b id="s-social">0</b></li>
      <li><i class="sw sw--unknown"></i><span data-i18n="typeUnverified"></span> <b id="s-unknown">0</b></li>
      <li><i class="sw sw--site"></i><span data-i18n="typeOwn"></span> <b id="s-site">0</b></li>
    </ul>

    <div class="verify">
      <label class="switch">
        <input id="auto" type="checkbox" />
        <span class="track"><span class="thumb"></span></span>
        <span class="switch__text">
          <span data-i18n="openCardsTitle"></span>
          <small data-i18n="openCardsHelp"></small>
        </span>
      </label>
      <button id="verify" class="btn btn--primary btn--sm" type="button" data-i18n-title="captureAllTitle"></button>
    </div>
  </section>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="live" aria-selected="true"><span data-i18n="tabLive"></span> <span class="count" id="c-live"></span></button>
    <button role="tab" data-tab="best" aria-selected="false" data-i18n="tabBest"></button>
    <button role="tab" data-tab="export" aria-selected="false" data-i18n="tabExport"></button>
  </nav>

  <main>
    <section class="panel" data-panel="live">
      <ol class="feed" id="feed"></ol>
      <p class="empty" id="feed-empty" data-i18n="feedEmpty"></p>
    </section>

    <section class="panel" data-panel="best" hidden>
      <ol class="rank" id="rank"></ol>
      <p class="empty" id="rank-empty" data-i18n="rankEmpty"></p>
    </section>

    <section class="panel" data-panel="export" hidden>
      <div class="field">
        <span class="label" data-i18n="filterType"></span>
        <div class="segmented" id="f-type">
          <button type="button" data-value="nosite" data-i18n="filterNoSite"></button>
          <button type="button" data-value="none" data-i18n="filterNone"></button>
          <button type="button" data-value="all" data-i18n="filterAll"></button>
        </div>
      </div>
      <label class="field">
        <span class="label"><span data-i18n="minReviews"></span> <output id="o-reviews">0</output></span>
        <input id="f-reviews" type="range" min="0" max="500" step="10" value="0" />
      </label>
      <label class="field">
        <span class="label"><span data-i18n="minScore"></span> <output id="o-score">0</output></span>
        <input id="f-score" type="range" min="0" max="100" step="5" value="0" />
      </label>
      <p class="hint" id="hint"></p>
      <div class="actions">
        <button id="export" class="btn btn--primary" type="button" data-i18n="exportCsv"></button>
        <button id="clear" class="btn btn--ghost" type="button" data-i18n="clearData"></button>
      </div>
    </section>
  </main>

  <aside class="sheet" id="sheet" hidden>
    <header class="sheet__top">
      <button id="sheet-back" class="icon-btn" type="button" data-i18n-aria="back">←</button>
      <span data-i18n="sheetTitle"></span>
    </header>
    <div class="sheet__body">
      <div class="map" id="d-map"></div>
      <div class="d-head">
        <div>
          <h2 id="d-name"></h2>
          <p id="d-sub"></p>
        </div>
        <div class="d-score">
          <b id="d-score"></b>
          <span data-i18n="scoreLabel"></span>
        </div>
      </div>
      <span class="tag" id="d-tag"></span>
      <dl class="info" id="d-info"></dl>
      <div class="d-actions">
        <a id="d-open" class="btn btn--primary" target="_blank" rel="noopener" data-i18n="openInMaps"></a>
        <a id="d-route" class="btn btn--line" target="_blank" rel="noopener" data-i18n="directions"></a>
      </div>
    </div>
  </aside>

  <script src="popup.js"></script>
</body>
</html>
